# Verificação de qualidade a cada push na main e em pull requests:
# HTML válido, nenhum link quebrado, a parte em React compilando e Lighthouse dentro do orçamento (.lighthouserc.json).
name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: HTML válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y html-validate@9.4.1 index.html 404.html

  links:
    # o 404.html usa caminhos a partir da raiz do Pages (/leadpagecarlos/...), por isso a raiz é a pasta acima do repositório
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --root-dir ${{ github.workspace }}/..
            --exclude "wa\.me" --exclude "fonts\.(googleapis|gstatic)\.com" --exclude "linkedin\.com"
            --exclude-path ferramentas/node_modules
            index.html 404.html README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ilha:
    # parte em React (app/): tipos do TypeScript e build do Vite
    name: Topo 3D (TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
